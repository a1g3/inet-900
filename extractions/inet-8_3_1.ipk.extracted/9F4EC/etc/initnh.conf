# initnh.conf
#
# iNET 'initnh' configuration file
#
# initnh is the iNET replacement of the standard '/sbin/init'
#
# All processes, or scripts to be run at boot must be listed
# here, in order ( first to last ).
#
# Format:
#
# seq# : path : spawn sfx : kill sfx : echo string : respawn : wait
#
#   where seq# = spawn sequence number, these go from 0 incrementing
#                by one...included for clarity only, must be in order
#         path = full path to file to be executed
#         args = cmdline arguments, must always have one...the name of
#                the process ( as it will appear in ps output, etc )
#    spawn sfx = suffix of spawn function to use, can be one of
#                following:
#                             generic
#                             driver
#     kill sfx = suffix of kill function to use, see spawn sfx for
#                available types
#  echo string = string to be ouput on console when process/script
#                is exec'd
#      respawn = boolean, should the process/script be exec'd if 
#                it dies
#         wait = should initnh wait for process/script to terminate
#

